<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy To Share Clipboard</title>
    <style>
        /* CSS Variables for Dark Mode */
        :root {
            --bg-color: #f4f5f7;
            --text-color: #333;
            --box-bg: white;
            --border-color: #ccc;
            --secondary-text: #888;
            --input-bg: white;
            --clip-bg: #e9ecef;
        }

        .dark-mode {
            --bg-color: #121212;
            --text-color: #e4e5e8;
            --box-bg: #1e1e1e;
            --border-color: #333;
            --secondary-text: #aaa;
            --input-bg: #2c2d30;
            --clip-bg: #3a3b3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            transition: 0.3s;
        }

        h1 { margin-bottom: 20px; text-align: center; }

        /* Dark Mode Toggle */
        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Screen Management */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
        }
        .screen.active { display: flex; }

        /* Home Buttons */
        .btn-large {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-host { background-color: #007aff; color: white; }
        .btn-join { background-color: var(--box-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-large:active { opacity: 0.8; transform: scale(0.98); }

        /* Join Screen */
        .code-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .code-input {
            width: 50px; height: 60px; font-size: 28px; text-align: center;
            border: 2px solid var(--border-color); border-radius: 10px;
            background: var(--input-bg); color: var(--text-color);
        }
        .code-input:focus { outline: none; border-color: #007aff; }

        /* Timer Banner */
        #timer-banner {
            display: none; width: 100%; background: #ff3b30; color: white;
            text-align: center; padding: 10px; border-radius: 8px; font-weight: bold;
            margin-bottom: 10px; box-shadow: 0 4px 6px rgba(255, 59, 48, 0.3);
        }

        /* Room Header */
        .room-header {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 10px;
        }
        .room-code-display { font-size: 24px; font-weight: bold; color: #007aff; letter-spacing: 2px; }
        
        .header-actions { display: flex; gap: 10px; }
        .btn-text-action { background: none; border: none; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-leave { color: #888; }
        .btn-clear-all { color: #ff3b30; }

        /* QR Code */
        #qr-container {
            display: none; text-align: center; margin-bottom: 15px;
            background: white; padding: 10px; border-radius: 12px;
        }
        #qr-container p { margin: 5px 0 0 0; font-size: 12px; color: #333; font-weight: bold; }

        /* Feed (Timeline) */
        #feed {
            width: 100%; flex-grow: 1; overflow-y: auto;
            background: var(--box-bg); border: 1px solid var(--border-color);
            border-radius: 12px 12px 0 0; padding: 15px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 15px; border-bottom: none;
        }
        
        .clip-bubble {
            background: var(--clip-bg); padding: 12px; border-radius: 12px;
            word-wrap: break-word; font-size: 16px; position: relative;
        }
        .clip-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .clip-actions { display: flex; gap: 10px; margin-top: 8px; }
        .clip-btn {
            background: #007aff; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .clip-btn.link-btn { background: #ff9500; }

        /* Input Area */
        .input-area {
            width: 100%; display: flex; background: var(--box-bg);
            border: 1px solid var(--border-color); border-radius: 0 0 12px 12px;
            padding: 10px; box-sizing: border-box; gap: 10px; align-items: center;
        }
        #compose-text {
            flex-grow: 1; border: none; background: transparent; color: var(--text-color);
            font-size: 16px; resize: none; height: 40px; outline: none;
        }
        .btn-icon {
            background: var(--clip-bg); border: none; font-size: 20px;
            width: 45px; height: 45px; border-radius: 10px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .btn-send { background: #007aff; color: white; }
        
        #file-input { display: none; }
        .upload-status { width: 100%; text-align: center; font-size: 12px; color: #007aff; display: none; margin-top: 5px;}

    </style>
</head>
<body>

    <button id="theme-toggle">🌙</button>
    <h1>Web Clipboard</h1>

    <!-- SCREEN 1: HOME -->
    <div id="screen-home" class="screen active">
        <button class="btn-large btn-host" id="btn-host-room">Host a Room</button>
        <button class="btn-large btn-join" id="btn-goto-join">Join a Room</button>
    </div>

    <!-- SCREEN 2: JOIN -->
    <div id="screen-join" class="screen">
        <h3>Enter 4-Digit Code</h3>
        <div class="code-container">
            <input type="tel" class="code-input" maxlength="1" id="digit-1">
            <input type="tel" class="code-input" maxlength="1" id="digit-2">
            <input type="tel" class="code-input" maxlength="1" id="digit-3">
            <input type="tel" class="code-input" maxlength="1" id="digit-4">
        </div>
        <button class="btn-text-action btn-leave" id="btn-cancel-join">Cancel</button>
    </div>

    <!-- SCREEN 3: ROOM (The Timeline) -->
    <div id="screen-room" class="screen" style="height: 85vh;">
        
        <!-- Timer Warning -->
        <div id="timer-banner">Warning: Room self-destructs in <span id="countdown-text">05:00</span> due to inactivity</div>

        <div class="room-header">
            <div>Code: <span class="room-code-display" id="display-code">----</span></div>
            <div class="header-actions">
                <button class="btn-text-action btn-clear-all" id="btn-clear-all">Clear All</button>
                <button class="btn-text-action btn-leave" id="btn-leave-room">Leave</button>
            </div>
        </div>

        <div id="qr-container">
            <img id="qr-code-img" src="" alt="QR Code" width="120" height="120">
            <p>Scan to join instantly</p>
        </div>
        
        <!-- Chat/Feed Area -->
        <div id="feed">
            <!-- Clips will load here -->
        </div>

        <!-- Input Box -->
        <div class="input-area">
            <input type="file" id="file-input" accept="image/*">
            <button class="btn-icon" id="btn-attach">📷</button>
            <textarea id="compose-text" placeholder="Type or paste (Ctrl+V) text/images..."></textarea>
            <button class="btn-icon btn-send" id="btn-send">⬆️</button>
        </div>
        <div id="upload-status" class="upload-status">Uploading image...</div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCi33nEcPYW3k1AticNFE8lA_JaST73gg",
            authDomain: "easytoshare.firebaseapp.com",
            databaseURL: "https://easytoshare-default-rtdb.firebaseio.com",
            projectId: "easytoshare",
            storageBucket: "easytoshare.firebasestorage.app",
            messagingSenderId: "792674310312",
            appId: "1:792674310312:web:046f3ad5cb89fa1e018a9d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Globals
        let currentCode = "";
        let clipsRef = null;
        let activityRef = null;
        
        // Timer Globals
        let lastActivityTime = Date.now();
        let idleInterval = null;

        // UI Elements
        const feed = document.getElementById('feed');
        const composeText = document.getElementById('compose-text');
        const fileInput = document.getElementById('file-input');
        const uploadStatus = document.getElementById('upload-status');
        const timerBanner = document.getElementById('timer-banner');
        const countdownText = document.getElementById('countdown-text');
        const codeInputs = document.querySelectorAll('.code-input');

        // --- Dark Mode ---
        const themeToggle = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerText = isDark ? '☀️' : '🌙';
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- Idle Timer Logic (The Screensaver) ---
        function reportActivity() {
            if (!currentCode || !activityRef) return;
            const now = Date.now();
            // Only write to Firebase if it's been more than 5 seconds since last report to save data
            if (now - lastActivityTime > 5000) {
                lastActivityTime = now;
                set(activityRef, now);
            }
        }

        function checkIdleStatus() {
            const now = Date.now();
            const elapsed = now - lastActivityTime;
            const thirtyMins = 30 * 60 * 1000;
            const twentyFiveMins = 25 * 60 * 1000;

            if (elapsed >= thirtyMins) {
                // Time's up! Nuke the room.
                remove(ref(db, 'rooms/' + currentCode));
                alert("Room self-destructed due to 30 minutes of inactivity to protect your data.");
                leaveRoom();
            } else if (elapsed >= twentyFiveMins) {
                // Show Warning Banner
                timerBanner.style.display = 'block';
                const remaining = thirtyMins - elapsed;
                const mins = Math.floor(remaining / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                countdownText.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
            } else {
                timerBanner.style.display = 'none';
            }
        }

        // Listen for ANY physical movement to reset the timer
        document.addEventListener('mousemove', reportActivity);
        document.addEventListener('keydown', reportActivity);
        document.addEventListener('touchstart', reportActivity);
        // ------------------------------------------

        // --- Room Management ---
        function hostRoom() {
            currentCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            // Generate QR Code
            const joinUrl = window.location.origin + window.location.pathname + "?room=" + currentCode;
            document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(joinUrl)}`;
            document.getElementById('qr-container').style.display = 'block';

            connectToRoom(currentCode);
            showScreen('screen-room');
        }

        // Auto-Join from QR
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('room') && urlParams.get('room').length === 4) {
            connectToRoom(urlParams.get('room'));
            showScreen('screen-room');
        }

        document.getElementById('btn-host-room').addEventListener('click', hostRoom);
        document.getElementById('btn-goto-join').addEventListener('click', () => {
            showScreen('screen-join');
            codeInputs[0].focus();
        });
        document.getElementById('btn-cancel-join').addEventListener('click', () => showScreen('screen-home'));
        
        // Manual Join
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < 3) codeInputs[index + 1].focus();
                let enteredCode = "";
                codeInputs.forEach(inp => enteredCode += inp.value);
                if (enteredCode.length === 4) {
                    connectToRoom(enteredCode);
                    showScreen('screen-room');
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) codeInputs[index - 1].focus();
            });
        });

        // Connection
        function connectToRoom(code) {
            currentCode = code;
            document.getElementById('display-code').innerText = code;
            
            clipsRef = ref(db, 'rooms/' + code + '/clips');
            activityRef = ref(db, 'rooms/' + code + '/lastActivity');

            // Force activity update on join
            set(activityRef, Date.now());

            // Listen for other device's activity to sync the timer
            onValue(activityRef, (snapshot) => {
                if (snapshot.exists()) lastActivityTime = snapshot.val();
            });

            // Start the Screensaver checker
            idleInterval = setInterval(checkIdleStatus, 1000);

            // Listen for new clips
            onValue(clipsRef, (snapshot) => {
                feed.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    Object.values(data).forEach(clip => addClipToUI(clip));
                    feed.scrollTop = feed.scrollHeight; // Auto-scroll to bottom
                }
            });
        }

        function leaveRoom() {
            if (clipsRef) off(clipsRef);
            if (activityRef) off(activityRef);
            clearInterval(idleInterval);
            currentCode = "";
            document.getElementById('qr-container').style.display = 'none';
            timerBanner.style.display = 'none';
            window.history.pushState({}, document.title, window.location.pathname); // Clear URL
            showScreen('screen-home');
        }
        document.getElementById('btn-leave-room').addEventListener('click', leaveRoom);

        // Clear All Button
        document.getElementById('btn-clear-all').addEventListener('click', () => {
            if (confirm("Delete all history?")) {
                remove(clipsRef);
            }
        });

        // --- Sending Clips (Text & Image) ---
        
        function sendTextClip() {
            const text = composeText.value.trim();
            if (text === "") return;
            push(clipsRef, { type: 'text', content: text, timestamp: Date.now() });
            composeText.value = "";
            reportActivity();
        }
        document.getElementById('btn-send').addEventListener('click', sendTextClip);
        
        // Send on Enter key
        composeText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTextClip();
            }
        });

        // Upload Photo Button (For iPhone)
        document.getElementById('btn-attach').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) uploadImageFile(e.target.files[0]);
        });

        // Paste Event (For Windows Ctrl+V screenshots)
        document.addEventListener('paste', (e) => {
            if (!currentCode) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    e.preventDefault(); // Stop image from pasting into text box as weird text
                    const file = item.getAsFile();
                    uploadImageFile(file);
                }
            }
        });

        function uploadImageFile(file) {
            uploadStatus.style.display = 'block';
            const uniqueName = Date.now() + '-' + file.name;
            const imageRef = storageRef(storage, `rooms/${currentCode}/${uniqueName}`);
            
            uploadBytes(imageRef, file).then((snapshot) => {
                getDownloadURL(snapshot.ref).then((downloadURL) => {
                    push(clipsRef, { type: 'image', content: downloadURL, timestamp: Date.now() });
                    uploadStatus.style.display = 'none';
                    reportActivity();
                });
            }).catch(err => {
                alert("Upload failed! Did you enable Firebase Storage?");
                uploadStatus.style.display = 'none';
            });
        }

        // --- UI Builder ---
        function addClipToUI(clip) {
            const bubble = document.createElement('div');
            bubble.className = 'clip-bubble';

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'clip-actions';

            if (clip.type === 'text') {
                bubble.innerText = clip.content;

                // Copy Button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'clip-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(clip.content);
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => copyBtn.innerText = 'Copy', 2000);
                };
                actionsDiv.appendChild(copyBtn);

                // Smart Link Check
                const urlPattern = /^(https?:\/\/[^\s]+)|(www\.[^\s]+)$/i;
                if (urlPattern.test(clip.content.trim())) {
                    const linkBtn = document.createElement('button');
                    linkBtn.className = 'clip-btn link-btn';
                    linkBtn.innerText = 'Open Link';
                    linkBtn.onclick = () => {
                        let finalUrl = clip.content.trim();
                        if (!finalUrl.startsWith('http')) finalUrl = 'https://' + finalUrl;
                        window.open(finalUrl, '_blank');
                    };
                    actionsDiv.appendChild(linkBtn);
                }

                bubble.appendChild(actionsDiv);

            } else if (clip.type === 'image') {
                const img = document.createElement('img');
                img.src = clip.content;
                img.className = 'clip-img';
                bubble.appendChild(img);

                // Download Button for Image
                const downBtn = document.createElement('button');
                downBtn.className = 'clip-btn';
                downBtn.innerText = 'Open Full Size';
                downBtn.onclick = () => window.open(clip.content, '_blank');
                
                actionsDiv.appendChild(downBtn);
                bubble.appendChild(actionsDiv);
            }

            feed.appendChild(bubble);
        }

    </script>
</body>
</html>
