<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy To Share Clipboard</title>
    <style>
        /* CSS Variables for Dark Mode Support */
        :root {
            --bg-color: #f4f5f7;
            --text-color: #333;
            --box-bg: white;
            --border-color: #ccc;
            --secondary-text: #888;
            --input-bg: white;
        }

        .dark-mode {
            --bg-color: #121212;
            --text-color: #e4e5e8;
            --box-bg: #1e1e1e;
            --border-color: #333;
            --secondary-text: #aaa;
            --input-bg: #2c2d30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        /* Dark Mode Toggle Button */
        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #theme-toggle:active { transform: scale(0.8); }

        /* Screen Management */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* Home Screen Buttons */
        .btn-large {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-host {
            background-color: #007aff;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
        }
        .btn-join {
            background-color: var(--box-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .btn-link {
            background-color: #ff9500;
            color: white;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(255, 149, 0, 0.3);
            display: none; /* Hidden by default */
        }
        .btn-large:active { opacity: 0.8; transform: scale(0.98); }

        /* Join Screen Code Boxes */
        .code-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .code-input {
            width: 50px;
            height: 60px;
            font-size: 28px;
            text-align: center;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
        }
        .code-input:focus { outline: none; border-color: #007aff; }

        /* Room Screen */
        .room-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .room-code-display {
            font-size: 24px;
            font-weight: bold;
            color: #007aff;
            letter-spacing: 2px;
        }
        .btn-leave {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        /* QR Code Container */
        #qr-container {
            display: none;
            text-align: center;
            margin-bottom: 15px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #qr-container p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
            background: var(--box-bg);
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: background-color 0.3s, color 0.3s;
        }
        textarea:focus { outline: none; border-color: #007aff; }

        /* Action Buttons Grid */
        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
        }
        .btn-action {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-copy { background-color: #34c759; }
        .btn-paste { background-color: #007aff; }
        .btn-clear { background-color: #ff3b30; }
        .btn-action:active { opacity: 0.8; }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            font-size: 12px;
        }
        .status-text { color: var(--secondary-text); }
        .typing-indicator { color: #007aff; font-weight: bold; display: none; }

    </style>
</head>
<body>

    <button id="theme-toggle">🌙</button>

    <h1>Web Clipboard</h1>

    <!-- SCREEN 1: HOME -->
    <div id="screen-home" class="screen active">
        <button class="btn-large btn-host" id="btn-host-room">Host a Room</button>
        <button class="btn-large btn-join" id="btn-goto-join">Join a Room</button>
    </div>

    <!-- SCREEN 2: JOIN -->
    <div id="screen-join" class="screen">
        <h3>Enter 4-Digit Code</h3>
        <div class="code-container">
            <input type="tel" class="code-input" maxlength="1" id="digit-1">
            <input type="tel" class="code-input" maxlength="1" id="digit-2">
            <input type="tel" class="code-input" maxlength="1" id="digit-3">
            <input type="tel" class="code-input" maxlength="1" id="digit-4">
        </div>
        <button class="btn-leave" id="btn-cancel-join">Cancel</button>
    </div>

    <!-- SCREEN 3: ROOM -->
    <div id="screen-room" class="screen">
        <div class="room-header">
            <div>Code: <span class="room-code-display" id="display-code">----</span></div>
            <button class="btn-leave" id="btn-leave-room">Leave</button>
        </div>

        <!-- QR Code Display for Host -->
        <div id="qr-container">
            <img id="qr-code-img" src="" alt="QR Code" width="130" height="130">
            <p>Scan to join instantly</p>
        </div>
        
        <textarea id="shared-text" placeholder="Type or paste text here to share..."></textarea>
        
        <!-- Smart Link Button -->
        <button id="btn-open-link" class="btn-large btn-link">🌐 Open Link</button>

        <div class="action-buttons">
            <button class="btn-action btn-copy" id="btn-copy">Copy</button>
            <button class="btn-action btn-paste" id="btn-paste">Paste</button>
            <button class="btn-action btn-clear" id="btn-clear">Clear</button>
        </div>
        
        <div class="status-bar">
            <div class="status-text" id="sync-status">🟢 Connected</div>
            <div class="typing-indicator" id="typing-indicator">Someone is typing...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCi33nEcPYW3k1AticNFE8lA_JaST73gg",
            authDomain: "easytoshare.firebaseapp.com",
            databaseURL: "https://easytoshare-default-rtdb.firebaseio.com",
            projectId: "easytoshare",
            storageBucket: "easytoshare.firebasestorage.app",
            messagingSenderId: "792674310312",
            appId: "1:792674310312:web:046f3ad5cb89fa1e018a9d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global Variables
        let currentRoomRef = null;
        let typingRef = null;
        let isTyping = false;
        let currentCode = "";
        let typingTimeout;

        // UI Elements
        const textArea = document.getElementById('shared-text');
        const syncStatus = document.getElementById('sync-status');
        const typingIndicator = document.getElementById('typing-indicator');
        const codeInputs = document.querySelectorAll('.code-input');
        const btnOpenLink = document.getElementById('btn-open-link');

        // --- FEATURE 1: Dark Mode Logic ---
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerText = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.innerText = isDark ? '☀️' : '🌙';
        });
        // ----------------------------------

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-join') {
                codeInputs[0].focus();
                codeInputs.forEach(input => input.value = ''); 
            }
        }

        // Host Logic with QR Code Generation
        function hostRoom() {
            const hostBtn = document.getElementById('btn-host-room');
            const originalText = hostBtn.innerText;
            hostBtn.innerText = "Creating...";
            
            currentCode = Math.floor(1000 + Math.random() * 9000).toString();
            
            const newRoomRef = ref(db, 'rooms/' + currentCode);
            set(newRoomRef, "Waiting for text...")
                .then(() => {
                    document.getElementById('display-code').innerText = currentCode;
                    hostBtn.innerText = originalText;
                    
                    // --- FEATURE 2: QR Code Generation ---
                    // Generates a link like: https://dev1661.github.io/EasyToShare/?room=1234
                    const joinUrl = window.location.origin + window.location.pathname + "?room=" + currentCode;
                    document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;
                    document.getElementById('qr-container').style.display = 'block';
                    // -------------------------------------

                    connectToRoom(currentCode);
                    showScreen('screen-room');
                })
                .catch((error) => {
                    hostBtn.innerText = originalText;
                    alert("Error creating room! Details: " + error.message);
                });
        }

        function leaveRoom() {
            if (currentRoomRef) off(currentRoomRef);
            if (typingRef) off(typingRef);
            textArea.value = "";
            document.getElementById('qr-container').style.display = 'none';
            btnOpenLink.style.display = 'none';
            
            // Clear URL if joined via QR code
            window.history.pushState({}, document.title, window.location.pathname);
            showScreen('screen-home');
        }

        document.getElementById('btn-host-room').addEventListener('click', hostRoom);
        document.getElementById('btn-goto-join').addEventListener('click', () => showScreen('screen-join'));
        document.getElementById('btn-cancel-join').addEventListener('click', () => showScreen('screen-home'));
        document.getElementById('btn-leave-room').addEventListener('click', leaveRoom);

        // Join Logic (Manual entry)
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < 3) codeInputs[index + 1].focus();
                
                let enteredCode = "";
                codeInputs.forEach(inp => enteredCode += inp.value);
                
                if (enteredCode.length === 4) {
                    currentCode = enteredCode;
                    document.getElementById('display-code').innerText = currentCode;
                    connectToRoom(currentCode);
                    showScreen('screen-room');
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) codeInputs[index - 1].focus();
            });
        });

        // --- FEATURE 3: Auto-Join from QR Code URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        if (roomParam && roomParam.length === 4) {
            currentCode = roomParam;
            document.getElementById('display-code').innerText = currentCode;
            document.getElementById('qr-container').style.display = 'none'; // Hide QR if they just joined
            connectToRoom(currentCode);
            showScreen('screen-room');
        }
        // ---------------------------------------------

        // Firebase Sync Connection
        function connectToRoom(roomCode) {
            currentRoomRef = ref(db, 'rooms/' + roomCode);
            typingRef = ref(db, 'typing/' + roomCode);
            
            // Listen for text updates
            onValue(currentRoomRef, (snapshot) => {
                if (!isTyping) {
                    const data = snapshot.val();
                    if(data !== "Waiting for text...") {
                        textArea.value = data || "";
                        checkIfLink(data || ""); // Check for Smart Link
                    }
                }
            }, (error) => {
                alert("Connection lost: " + error.message);
                leaveRoom();
            });

            // Listen for typing indicator
            onValue(typingRef, (snapshot) => {
                if (snapshot.val() === true && !isTyping) {
                    typingIndicator.style.display = 'block';
                } else {
                    typingIndicator.style.display = 'none';
                }
            });
        }

        // --- FEATURE 4: Smart Link Detector ---
        function checkIfLink(text) {
            text = text.trim();
            // Basic check if it looks like a URL
            const urlPattern = /^(https?:\/\/[^\s]+)|(www\.[^\s]+)$/i;
            if (urlPattern.test(text)) {
                btnOpenLink.style.display = 'block';
                btnOpenLink.onclick = () => {
                    let finalUrl = text;
                    if (!finalUrl.startsWith('http')) finalUrl = 'https://' + finalUrl;
                    window.open(finalUrl, '_blank');
                };
            } else {
                btnOpenLink.style.display = 'none';
            }
        }
        // --------------------------------------

        textArea.addEventListener('input', (e) => {
            updateFirebase(e.target.value);
            
            // Trigger "Is Typing" for 1.5 seconds
            if (typingRef) {
                set(typingRef, true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    set(typingRef, false);
                }, 1500);
            }
        });

        function updateFirebase(text) {
            if (!currentRoomRef) return;
            isTyping = true;
            syncStatus.innerText = "🔄 Syncing...";
            checkIfLink(text); // Check local typing for links too
            
            set(currentRoomRef, text).then(() => {
                isTyping = false;
                syncStatus.innerText = "🟢 Synced";
            }).catch((error) => {
                syncStatus.innerText = "❌ Sync Error";
            });
        }

        // Action Buttons
        document.getElementById('btn-copy').addEventListener('click', () => {
            navigator.clipboard.writeText(textArea.value).then(() => {
                const btn = document.getElementById('btn-copy');
                btn.innerText = "Copied!";
                setTimeout(() => btn.innerText = "Copy", 2000);
            });
        });

        document.getElementById('btn-paste').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                textArea.value = text;
                updateFirebase(text); 
                
                const btn = document.getElementById('btn-paste');
                btn.innerText = "Pasted!";
                setTimeout(() => btn.innerText = "Paste", 2000);
            } catch (err) {
                alert("Please paste manually. Your browser blocks automatic pasting.");
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            textArea.value = "";
            updateFirebase(""); 
            
            const btn = document.getElementById('btn-clear');
            btn.innerText = "Cleared!";
            setTimeout(() => btn.innerText = "Clear", 2000);
        });

    </script>
</body>
</html>
